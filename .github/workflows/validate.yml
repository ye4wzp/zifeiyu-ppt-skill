name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Unit tests (measurement, export primitives, validator, scaffold)
        run: npm test
      - name: Style package self-check
        run: |
          for s in styles/*/; do node scripts/check-style.mjs "$s"; done
      - name: Validate golden decks (R1-R16 machine gate)
        run: |
          node scripts/validate.mjs examples/showcase
          node scripts/validate.mjs examples/media
          for g in styles/*/golden; do node scripts/validate.mjs "$g"; done
      - name: Render check
        run: |
          node scripts/render-png.mjs examples/showcase --out /tmp/renders
          test -f /tmp/renders/slide-16.png
      - name: PPTX export + artifact gate
        run: |
          node scripts/export-pptx.mjs examples/showcase --out /tmp/deck.pptx
          node scripts/check-pptx.mjs /tmp/deck.pptx --expect-slides 16
          node scripts/export-pptx.mjs examples/media --out /tmp/media.pptx
          unzip -l /tmp/media.pptx | grep -q "media-.*\.mp4"
          node scripts/check-pptx.mjs /tmp/media.pptx --expect-slides 6
          node scripts/export-pptx.mjs styles/swiss/golden --out /tmp/swiss.pptx --native-charts
          node scripts/check-pptx.mjs /tmp/swiss.pptx --expect-slides 17
          node scripts/export-pptx.mjs styles/consulting/golden --out /tmp/consulting.pptx --native-charts
          node scripts/check-pptx.mjs /tmp/consulting.pptx --expect-slides 17
          node scripts/export-pptx.mjs styles/photobook/golden --out /tmp/photobook.pptx --native-charts
          unzip -l /tmp/photobook.pptx | grep -q "media-.*\.mp4"
          node scripts/check-pptx.mjs /tmp/photobook.pptx --expect-slides 18
          node scripts/export-pptx.mjs styles/keynote/golden --out /tmp/keynote.pptx --native-charts
          unzip -l /tmp/keynote.pptx | grep -q "media-.*\.mp4"
          node scripts/check-pptx.mjs /tmp/keynote.pptx --expect-slides 18
          node scripts/export-pptx.mjs styles/broadsheet/golden --out /tmp/broadsheet.pptx --native-charts
          node scripts/check-pptx.mjs /tmp/broadsheet.pptx --expect-slides 17
          node scripts/export-pptx.mjs styles/poster/golden --out /tmp/poster.pptx --native-charts
          node scripts/check-pptx.mjs /tmp/poster.pptx --expect-slides 17
          node scripts/export-pptx.mjs styles/soft/golden --out /tmp/soft.pptx --native-charts
          node scripts/check-pptx.mjs /tmp/soft.pptx --expect-slides 17
          node scripts/export-pptx.mjs styles/magazine/golden --out /tmp/magazine.pptx
          unzip -l /tmp/magazine.pptx | grep -q "media-.*\.mp4"
          node scripts/check-pptx.mjs /tmp/magazine.pptx --expect-slides 18
