name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium-headless-shell
      - name: Validate golden decks (R1-R13 machine gate)
        run: |
          node scripts/validate.mjs examples/showcase
          node scripts/validate.mjs examples/editorial
          node scripts/validate.mjs examples/media
          node scripts/validate.mjs examples/swiss
      - name: Render check
        run: |
          node scripts/render-png.mjs examples/showcase --out /tmp/renders
          test -f /tmp/renders/slide-16.png
      - name: PPTX export + artifact gate
        run: |
          node scripts/export-pptx.mjs examples/showcase --out /tmp/deck.pptx
          node scripts/check-pptx.mjs /tmp/deck.pptx --expect-slides 16
          node scripts/export-pptx.mjs examples/media --out /tmp/media.pptx
          unzip -l /tmp/media.pptx | grep -q "media-.*\.mp4"
          node scripts/check-pptx.mjs /tmp/media.pptx --expect-slides 6
